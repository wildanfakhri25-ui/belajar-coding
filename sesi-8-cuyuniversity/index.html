<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASSWORD GENERATOR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="d-flex flex-column justify-content-center align-items-center gap-4 bg-light p-5 rounded background-color shadow">
            <h1>PASSWORD GENERATOR CUYUNIVERSITY</h1>
            <div class="d-flex flex-column gap-2 mt-2">
                <label for="passwordLength" class="text-uppercase fw-bold">Panjang Password</label>
                <input class="form-control form-control-lg" id="passwordLength" type="number" min="8" max="128"/>
                <label for="password" class="text-uppercase fw-bold" >Password</label>
                <input class="form-control form-control-lg" id="password" disabled/>
                <button class="btn btn-dark text-uppercase fw-bold btn-lg mt-2" onclick="getPassword()">Generate Password</button>
                <a class="btn btn-primary text-uppercase fw-bold btn-lg mt-2 text-decoration-none" onclick="savePassword()" id="saveButton">save password</a>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
